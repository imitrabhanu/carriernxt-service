# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aicareercoach
spring.datasource.username=mitrabhanubal
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# Security Configuration
spring.security.jwt.secret=your-secret-key-here-please-change-in-production
spring.security.jwt.expiration=86400000

# CORS Configuration
spring.webmvc.cors.allowed-origins=*
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=*

logging.level.org.springframework.security=DEBUG
logging.level.com.aicareerarchitect=DEBUG
