server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aicareercoach
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    jwt:
      secret: your-secret-key-here-please-change-in-production
      expiration: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: DEBUG
    com.carriernxt: DEBUG 